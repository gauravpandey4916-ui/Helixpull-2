    window.HelixConfig = {

        this.shadow.innerHTML =`
          <style>

  color: var(--accent);
  letter-spacing: 1.5px;

}

            }

              display: flex;

            }

              border: 1px solid var(--border-glass);

            /* THEME SWITCHER */
            .theme-switch-deck {

              @media (max-width:480px)
              {.hero-headline { font-size : 26px; letter-spacing: 0.5px;}
              .hero-details { font-size : 10px; letter-spacing : 0px; } 
              . f1-card { padding: 24px 16px; } 
              . theme-switch-deck { bottom : 16px; right : 16px:} 
            }
          </style>

          <!-- BOOT SCREEN -->
          <div class="boot" id="boot">
              <div class="boot-header">
                  <div>HELIXPULL / STREAMING WEB</div>

              <div class="boot-center">
                  <div class="boot-logo-wrap">
                      <img src="https://files.catbox.moe/0ghrsb.jpg" alt="HELIXPULL Logo">
                  </div>
                  <div class="boot-title">HELIXPULL</div>
              </div>

              <div class="boot-footer">
                  <div class="boot-bar">
                      <div class="boot-fill" id="bootFill"></div>
                  </div>
                  <div class="boot-status">
                      <span class="boot-label" id="bootStatus">INITIALIZING SIGNAL</span>
                      <span class="boot-percent" id="bootPercent">0%</span>
                  </div>
              </div>
          </div>

          <!-- WELCOME GATE MODAL -->
          <div class="f1-modal-overlay" id="welcomeGate">
              <div class="f1-card">
                  <div class="f1-avatar-wrap">
                      <img src="https://files.catbox.moe/0ghrsb.jpg" alt="HELIXPULL">
                  </div>

                  <button class="f1-text-btn" id="dismissWelcomeBtn">LET'S WATCH</button>

          <canvas id="warpGridCanvas"></canvas>

          <div class="container" id="mainContainer">
            <header class="nav">

            <div id="home-view" class="view-section active">

                </div>

            </div>

            <div id="player-view" class="view-section">
              <div class="player-top-nav">
                <button class="back-home-btn" id="backHomeBtn">&#8592; Back to Channels</button>
              </div>

              <div class="player-rig-box" id="playerContainer">
                <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen="true"></iframe>
                <button class="blended-fs-btn" id="blendedFsBtn" title="Toggle Fullscreen">
                  <svg id="fsIconSvg" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
              </div 
                            </div>
              <div class="player-meta-bar">
                <div class="stream-title-group">
                  <strong id="activeStreamTitleDisplay">Live Broadcast</strong>
                  <span>HelixPull High-Definition Stream</span>
                </div>
                <button class="share-action-btn" id="btnShare">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                  <span id="shareBtnText">SHARE STREAM</span>
                </button>
              </div>
            </div>
          </div>

          <aside class="theme-switch-deck" id="themeSwitchDeck">
            <button class="mode-toggle-btn active" id="themeDarkBtn"><i></i> Obsidian</button>
            <button class="mode-toggle-btn" id="themeGoldBtn"><i></i> Gold</button>
          </aside>
        `;
      }

      connectedCallback() {
        this.initWarpField();
        this.initEventListeners();
        this.setupMessageListener();
        this.fetchChannels();
        this.handleUrlRouting();
        this.startBootSequence();
      }

      disconnectedCallback() {
        if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
      }

      updateBootTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timeEl = this.shadow.querySelector('#bootTime');
        if (timeEl) timeEl.textContent = `${hours}:${minutes}`;
      }

      startBootSequence() {
        this.updateBootTime();
        const fill = this.shadow.querySelector('#bootFill');
        const percent = this.shadow.querySelector('#bootPercent');
        const status = this.shadow.querySelector('#bootStatus');
        
        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.floor(Math.random() * 15) + 5;
          
          if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            
            fill.style.width = "100%";
            percent.textContent = "100%";
            status.textContent = "READY";
            
            setTimeout(() => {
              this.finishBoot();
            }, 300);
          } else {
            fill.style.width = progress + "%";
            percent.textContent = progress + "%";
          }
        }, 120);
      }

      finishBoot() {
        this.shadow.querySelector('#boot').classList.add('hide');

        const params = new URLSearchParams(window.location.search);
        if (!params.get('id')) {
          setTimeout(() => {
            this.shadow.querySelector('#welcomeGate').classList.add('open');
          }, 250);
        }
      }

      dismissWelcome() {
        this.shadow.querySelector('#welcomeGate').classList.remove('open');
      }

      async fetchChannels() {
        const grid = this.shadow.querySelector('#channels-grid');
        let data = null;

        try {
          const res = await fetch(window.HelixConfig.sourceUrl);
          data = await res.json();
        } catch (err) {
          console.warn("Direct fetch failed, attempting proxy fallback...", err);
          try {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(window.HelixConfig.sourceUrl);
            const res = await fetch(proxyUrl);
            data = await res.json();
          } catch (proxyErr) {
            console.error("CORS proxy fetch failed:", proxyErr);
          }
        }

        if (data) {
          const rawChannels = Array.isArray(data) ? data : (data.iframes || data.channels || data.streams || data.data || []);
          
          // Filter to find channels matching "Star Sports Hindi" and keep only the first two
          const filteredChannels = rawChannels.filter(channel => {
            const title = (channel.title || channel.name || channel.channel || '').toLowerCase();
            return title.includes('star sports hindi');
          });

          this.masterChannels = filteredChannels.slice(0, 2);
        }

        if (!this.masterChannels || this.masterChannels.length === 0) {
          grid.innerHTML = '<div class="state-container" style="color:#ef4444;">No channels found.</div>';
          return;
        }

        this.renderGrid();
      }

      renderGrid() {
        const grid = this.shadow.querySelector('#channels-grid');
        grid.innerHTML = '';

        // Assign custom display titles for web view
        const customNames = {
          0: "Fancode",
          1: "Sony Liv"
        };

        this.masterChannels.forEach((channel, index) => {
          const channelId = channel.id !== undefined ? channel.id : index;
          
          const rawTitle = channel.title || channel.name || channel.channel || `Channel ${index + 1}`;
          const title = customNames[index] || rawTitle;

          const poster = channel.poster || channel.image || channel.logo || channel.img || '';

          // Sony Network Icon and Tag Styling
            let tag = text.toLowerCase().includes('sony') ? "SONY" : "FANCODE";
          let badgeIcon = `<svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8zM6 10h2v4H6z"/></svg>`;

          const card = document.createElement('div');
          card.className = 'channel-card';
          card.onclick = () => this.openPlayer(channelId);

          let thumbHtml = poster 
            ? `<div class="card-thumbnail" style="background-image: url('${poster}')"><div class="play-overlay-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>`
            : `<div class="card-thumbnail">
                 <div class="channel-badge-box">${badgeIcon}</div>
                 <span class="card-network-tag">${tagText}</span>
                 <div class="play-overlay-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
               </div>`;

          card.innerHTML = `
            ${thumbHtml}
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-meta"><span>HD FEED</span><span style="color:var(--accent);">WATCH NOW</span></div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      openPlayer(identifier) {
        const target = this.masterChannels.find((ch, idx) => (ch.id == identifier) || (idx == identifier));
        if (!target) return;

        let streamUrl = target.iframeSrc || target.url || target.link || target.stream || target.file || target.source || target.src;
        if (!streamUrl) {
          streamUrl = `https://helixpull-cricket.gauravpandey4916.workers.dev/?id=${target.id || identifier}`;
        }

        const customNames = { 0: "Fancode", 1: "Sony Liv" };
        const title = customNames[identifier] || target.title || target.name || target.channel || "Live Broadcast";
        this.currentStreamId = identifier;

        this.shadow.querySelector('#activeStreamTitleDisplay').innerText ="Live Stream";
        this.shadow.querySelector('#player').src = streamUrl;

        this.shadow.querySelector('#home-view').classList.remove('active');
        this.shadow.querySelector('#player-view').classList.add('active');

        const query = `?id=${identifier}`;
        if (window.location.search !== query) {
          history.pushState({ playerOpen: true, id: identifier }, '', query);
        }
        window.scrollTo(0, 0);
      }

      closePlayer() {
        this.shadow.querySelector('#player').src = 'about:blank';

        try { if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); } catch(err){}
        this.shadow.querySelector('#playerContainer').classList.remove('fs-active');
        this.shadow.querySelector('#themeSwitchDeck').classList.remove('hidden');

        this.shadow.querySelector('#player-view').classList.remove('active');
        this.shadow.querySelector('#home-view').classList.add('active');
        this.currentStreamId = null;

        if (window.location.search !== '') {
          history.pushState({}, '', window.location.pathname);
        }
      }

      handleUrlRouting() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id !== null && this.masterChannels.length > 0) {
          this.openPlayer(id);
        }
      }

      toggleFullscreen() {
        const rig = this.shadow.querySelector('#playerContainer');
        const themeDeck = this.shadow.querySelector('#themeSwitchDeck');
        const fsIconSvg = this.shadow.querySelector('#fsIconSvg');
        if (!rig) return;

        const isFull = document.fullscreenElement || rig.classList.contains('fs-active');
        if (!isFull) {
          rig.classList.add('fs-active');
          if (themeDeck) themeDeck.classList.add('hidden');
          if (fsIconSvg) fsIconSvg.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
          try { if (rig.requestFullscreen) rig.requestFullscreen().catch(()=>{}); } catch(err){}
        } else {
          rig.classList.remove('fs-active');
          if (themeDeck) themeDeck.classList.remove('hidden');
          if (fsIconSvg) fsIconSvg.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
          try { if (document.exitFullscreen) document.exitFullscreen().catch(()=>{}); } catch(err){}
        }
      }

      setupMessageListener() {
        document.addEventListener('fullscreenchange', () => {
          const rig = this.shadow.querySelector('#playerContainer');
          const themeDeck = this.shadow.querySelector('#themeSwitchDeck');
          const fsIconSvg = this.shadow.querySelector('#fsIconSvg');

          if (!document.fullscreenElement && !document.webkitIsFullScreen && rig) {
            rig.classList.remove('fs-active');
            if (themeDeck) themeDeck.classList.remove('hidden');
            if (fsIconSvg) {
              fsIconSvg.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
            }
          }
        });
      }

      initEventListeners() {
        this.shadow.querySelector('#backHomeBtn').onclick = () => this.closePlayer();
        this.shadow.querySelector('#brandHomeLink').onclick = () => this.closePlayer();
        this.shadow.querySelector('#dismissWelcomeBtn').onclick = () => this.dismissWelcome();
        this.shadow.querySelector('#blendedFsBtn').onclick = () => this.toggleFullscreen();

        /* Theme Switches */
        this.shadow.querySelector('#themeDarkBtn').onclick = () => {
          this.removeAttribute('data-theme');
          this.shadow.querySelector('#themeDarkBtn').classList.add('active');
          this.shadow.querySelector('#themeGoldBtn').classList.remove('active');
          this.currentParticleRgb = '0, 255, 204'; // Cyan particles
        };

        this.shadow.querySelector('#themeGoldBtn').onclick = () => {
          this.setAttribute('data-theme', 'gold');
          this.shadow.querySelector('#themeGoldBtn').classList.add('active');
          this.shadow.querySelector('#themeDarkBtn').classList.remove('active');
          this.currentParticleRgb = '255, 215, 0'; // Gold particles
        };

        const btnShare = this.shadow.querySelector('#btnShare');
        const shareText = this.shadow.querySelector('#shareBtnText');
        btnShare.onclick = async () => {
          try {
            if (navigator.share) {
              await navigator.share({ title: 'HelixPull Live', url: window.location.href });
            } else {
              await navigator.clipboard.writeText(window.location.href);
              shareText.textContent = "COPIED!";
              setTimeout(() => { shareText.textContent = "SHARE STREAM"; }, 1800);
            }
          } catch(err){}
        };
      }

      initWarpField() {
        const canvas = this.shadow.getElementById('warpGridCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 100; i++) {
          this.stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 2 + 1,
            alpha: Math.random() * 0.5 + 0.1
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.lineWidth = 1.2;
          const activeRgb = this.currentParticleRgb || '0, 255, 204';

          this.stars.forEach(star => {
            ctx.strokeStyle = `rgba(${activeRgb}, ${star.alpha})`;
            ctx.beginPath();
            ctx.moveTo(star.x, star.y);
            ctx.lineTo(star.x + star.length, star.y);
            ctx.stroke();
            star.x += star.speed;
            if (star.x > canvas.width) {
              star.x = -star.length;
              star.y = Math.random() * canvas.height;
            }
          });
          this.animationFrameId = requestAnimationFrame(render);
        };
        render();
      }
    }

    customElements.define('helixpull-ui', HelixPullUI);
    </script>
</body>
</html>
