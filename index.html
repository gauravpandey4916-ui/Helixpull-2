<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a1733">
  <meta name="referrer" content="no-referrer">
  <title>HELIXPULL Premium Stream</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SMZXC121E6');
  </script>

  <!-- Shaka Player CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --blue1: #0b3b8c;
      --blue2: #072b6a;
      --bg: #060e20;
      --text: #ffffff;
      --accent-gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffe57f 0%, #ffd700 50%, #c79a00 100%);
      --card-border: rgba(255, 215, 0, 0.35);
      --shadow: rgba(0, 0, 0, 0.6);
      --transition: all 0.25s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
      line-height: 1.5;
    }

    .container { max-width: 980px; margin: 14px auto 0; padding: 0 12px 24px; }

    .header {
      background: linear-gradient(135deg, var(--blue1), var(--blue2));
      font-weight: 900;
      font-size: 22px;
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
      letter-spacing: 1px;
      color: var(--accent-gold);
      text-transform: uppercase;
      box-shadow: 0 8px 24px var(--shadow), 0 0 15px rgba(255, 215, 0, 0.15);
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .player-panel {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin: 12px 0;
      box-shadow: 0 10px 30px var(--shadow), 0 0 20px rgba(255, 215, 0, 0.2);
      border: 2px solid var(--card-border);
      position: relative;
    }

    .player-wrapper { width: 100%; position: relative; aspect-ratio: 16/9; background: #000; }
    
    .video-player, #main-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .shaka-spinner-container, .shaka-buffering-spinner, .shaka-spinner { display: none !important; }

    .error-overlay {
      position: absolute; inset: 0;
      background: rgba(6, 14, 32, 0.95);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 11; gap: 14px; padding: 20px; text-align: center;
    }
    .error-overlay.visible { display: flex; }
    .error-message { font-size: 16px; color: var(--accent-gold); max-width: 340px; font-weight: 600; }

    .section {
      background: linear-gradient(135deg, var(--blue1), var(--blue2));
      border-radius: 12px; padding: 16px; margin: 14px 0;
      box-shadow: 0 8px 20px var(--shadow);
      border: 1px solid var(--card-border);
    }

    .section-title { 
      margin-bottom: 12px; 
      text-align: center; 
      font-size: 18px; 
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px; 
    }

    .section-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; border-radius: 10px;
      font-weight: 800; font-size: 14px;
      background: var(--gold-gradient);
      color: #060e20;
      border: none;
      text-decoration: none; cursor: pointer; transition: var(--transition);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 215, 0, 0.4); }

    .popup-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .popup-overlay.visible { display: flex; }
    .popup-card {
      background: linear-gradient(135deg, #0d2247, #072b6a);
      border-radius: 16px; padding: 28px; text-align: center;
      max-width: 380px; width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(255, 215, 0, 0.25);
      border: 1.5px solid var(--accent-gold);
    }
    .popup-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; color: var(--accent-gold); }
    .popup-btn {
      display: block; width: 100%; padding: 12px; border: none;
      border-radius: 10px; font-weight: 800; font-size: 15px;
      cursor: pointer; margin-top: 10px; transition: var(--transition);
    }
    .popup-btn-primary { background: var(--gold-gradient); color: #060e20; }
    .popup-btn-secondary { background: rgba(255,255,255,0.12); color: #fff; }

    @media (max-width: 600px) {
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">HELIXPULL VIP STREAM</div>
    
    <div class="player-panel">
      <div class="player-wrapper shaka-mobile shaka-video-container" data-shaka-player-container id="playerContainer" shaka-controls="true">
        <video id="video" class="video-player shaka-video" data-shaka-player autoplay playsinline controlslist="nodownload noremoteplayback" oncontextmenu="return false"></video>
        <iframe id="main-iframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" allowfullscreen="true" referrerpolicy="no-referrer"></iframe>
        
        <div id="errorOverlay" class="error-overlay">
          <p id="errorMsg" class="error-message">Connecting to live feed...</p>
          <button class="btn" id="retryBtn">Retry Stream</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title" id="channelNameDisplay">Loading Channel...</div>
      <div class="section-row">
        <button class="btn" id="btnShare">Share Stream</button>
        <button class="btn" id="btnCopy">Copy Link</button>
      </div>
    </div>
  </div>

  <div id="tgPopup" class="popup-overlay">
    <div class="popup-card">
      <div class="popup-title">Join Telegram Channel</div>
      <p style="color: #cbd5e1; margin-bottom: 20px; font-size: 14px;">Access premium live channels and instant match updates.</p>
      <button class="popup-btn popup-btn-primary" id="tgJoinBtn">Join Telegram</button>
      <button class="popup-btn popup-btn-secondary" id="tgCloseBtn">Continue to Player</button>
    </div>
  </div>

  <script>
    "use strict";

    const CONFIG = {
      telegramLink: "https://telegram.me/helixpull",
      dataEndpoint: "https://allrounder2-0.pages.dev/api/Hindi.json"
    };

    let shakaPlayer = null;
    let shakaUI = null;

    function showError(msg) {
      const errOverlay = document.getElementById("errorOverlay");
      document.getElementById("errorMsg").textContent = msg;
      errOverlay.classList.add("visible");
    }

    function hideError() {
      document.getElementById("errorOverlay").classList.remove("visible");
    }

    async function initShakaEngine() {
      if (shakaPlayer) return;
      
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        showError("Browser is not supported for native DASH streams.");
        return;
      }

      const video = document.getElementById("video");
      const container = document.getElementById("playerContainer");

      shakaPlayer = new shaka.Player(video);
      shakaUI = new shaka.ui.Overlay(shakaPlayer, container, video);

      shakaPlayer.addEventListener("error", (e) => {
        console.error("Shaka Error Details:", e.detail);
        showError("Playback error. Please retry.");
      });
    }

    async function startStream() {
      hideError();
      const videoEl = document.getElementById("video");
      const iframeEl = document.getElementById("main-iframe");

      try {
        const urlParams = new URLSearchParams(window.location.search);
        const requestedId = (urlParams.get("id") || "").trim().toLowerCase();

        const response = await fetch(CONFIG.dataEndpoint, { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load channel playlist.");
        
        const data = await response.json();
        
        // Find target item safely across variations
        let target = null;
        if (Array.isArray(data)) {
          target = data.find(item => item.id && item.id.toString().toLowerCase() === requestedId) || data[0];
        } else if (typeof data === "object") {
          target = data[requestedId] || data;
        }

        if (!target) {
          showError("Channel not found.");
          return;
        }

        // Update Channel Title
        document.getElementById("channelNameDisplay").textContent = target.name || target.title || "Live Stream";

        const streamUrl = target.streamUrl || target.link || target.url;
        const iframeSrc = target.iframeSrc || target.iframe;

        // Case A: Embed via Iframe
        if (target.type === "iframe" || iframeSrc || (streamUrl && streamUrl.includes("pages.dev"))) {
          if (shakaPlayer) {
            await shakaPlayer.unload();
          }
          videoEl.style.display = "none";
          iframeEl.style.display = "block";
          iframeEl.src = iframeSrc || streamUrl;
          return;
        }

        // Case B: Direct Stream (DASH .mpd / HLS .m3u8)
        iframeEl.style.display = "none";
        iframeEl.src = "";
        videoEl.style.display = "block";

        await initShakaEngine();

        // Handle ClearKeys DRM
        if (target.drm && target.drm.clearKeys) {
          shakaPlayer.configure({ drm: { clearKeys: target.drm.clearKeys } });
        } else if (target.keyId && target.key) {
          shakaPlayer.configure({ drm: { clearKeys: { [target.keyId]: target.key } } });
        }

        if (streamUrl) {
          await shakaPlayer.load(streamUrl);
          videoEl.play().catch(() => {});
        } else {
          showError("Invalid stream source URL.");
        }

      } catch (err) {
        console.error("Stream initialization failed:", err);
        showError("Failed to fetch stream data. Click retry.");
      }
    }

    function initEvents() {
      document.getElementById("retryBtn").addEventListener("click", startStream);

      const copyUrl = () => {
        navigator.clipboard.writeText(window.location.href);
        alert("Stream link copied to clipboard!");
      };

      document.getElementById("btnShare").addEventListener("click", copyUrl);
      document.getElementById("btnCopy").addEventListener("click", copyUrl);

      const handleAuth = () => {
        window.open(CONFIG.telegramLink, "_blank");
        document.getElementById("tgPopup").classList.remove("visible");
        sessionStorage.setItem("helix_auth", "true");
        startStream();
      };

      document.getElementById("tgJoinBtn").addEventListener("click", handleAuth);
      document.getElementById("tgCloseBtn").addEventListener("click", () => {
        document.getElementById("tgPopup").classList.remove("visible");
        sessionStorage.setItem("helix_auth", "true");
        startStream();
      });

      if (sessionStorage.getItem("helix_auth") === "true") {
        document.getElementById("tgPopup").classList.remove("visible");
        startStream();
      } else {
        document.getElementById("tgPopup").classList.add("visible");
      }
    }

    document.addEventListener("DOMContentLoaded", initEvents);
  </script>
</body>
</html>
