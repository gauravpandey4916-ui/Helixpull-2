<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelixPull Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
    </style>
</head>
<body class="w-screen h-screen bg-black flex items-center justify-center relative select-none">

    <!-- STATE 1: NO ID / URL PROVIDED -->
    <div id="noIdScreen" class="flex flex-col items-center justify-center text-center p-6 w-full max-w-xl space-y-5 z-20">
        <div class="flex items-center gap-2.5 bg-white/5 border border-white/10 px-4 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
            <span class="text-xs font-bold tracking-widest text-white">HELIXPULL <span class="text-rose-500">PLAYER</span></span>
        </div>

        <div class="space-y-1.5">
            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Stream Player</h1>
            <p class="text-xs sm:text-sm text-gray-400">
                Paste an <span class="text-gray-200 font-medium">.m3u8</span>, <span class="text-gray-200 font-medium">.mpd</span>, or <span class="text-gray-200 font-medium">iframe URL</span> to play.
            </p>
        </div>

        <form id="customStreamForm" onsubmit="handleCustomPlay(event)" class="w-full flex flex-col sm:flex-row gap-2.5 bg-zinc-900/95 border border-white/10 p-2 rounded-2xl shadow-2xl">
            <input id="customUrlInput" type="text" required
                placeholder="https://example.com/stream.m3u8 or .mpd or iframe URL..."
                class="flex-1 bg-transparent text-white placeholder-gray-500 text-xs sm:text-sm px-3.5 py-2.5 focus:outline-none">
            <button type="submit"
                class="bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white text-xs sm:text-sm font-semibold px-6 py-2.5 rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shrink-0">
                <span>Play Now</span>
            </button>
        </form>

        <p id="inputErrorMsg" class="hidden text-xs text-rose-400 font-medium"></p>

        <div class="w-full flex items-center gap-3 text-[11px] text-gray-500">
            <span class="flex-1 h-px bg-white/10"></span><span>OR PLAY BY ID</span><span class="flex-1 h-px bg-white/10"></span>
        </div>

        <form id="customIdForm" onsubmit="handleIdPlay(event)" class="w-full flex flex-col sm:flex-row gap-2.5 bg-zinc-900/95 border border-white/10 p-2 rounded-2xl shadow-2xl">
            <input id="customIdInput" type="text" required autocomplete="off" autocapitalize="none"
                placeholder="Type an ID, e.g. Hindi"
                class="flex-1 bg-transparent text-white placeholder-gray-500 text-xs sm:text-sm px-3.5 py-2.5 focus:outline-none">
            <button type="submit"
                class="bg-white/10 hover:bg-white/20 active:scale-[0.98] text-white text-xs sm:text-sm font-semibold px-6 py-2.5 rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shrink-0">
                <span>Play ID</span>
            </button>
        </form>

        <div id="idChips" class="flex flex-wrap justify-center gap-2"></div>

        <p class="text-[11px] text-gray-500">
            Params: <code class="text-gray-300 bg-white/5 px-1.5 py-0.5 rounded">?id=Hindi</code> or <code class="text-gray-300 bg-white/5 px-1.5 py-0.5 rounded">?url=STREAM_URL</code>
        </p>
    </div>

    <!-- STATE 2: LOADING -->
    <div id="loaderScreen" class="hidden flex-col items-center justify-center text-center p-6 space-y-3 z-20">
        <div class="w-11 h-11 border-[3px] border-rose-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs sm:text-sm text-gray-300 font-medium tracking-wide">Connecting to stream...</p>
    </div>

    <!-- STATE 3: ERROR -->
    <div id="errorScreen" class="hidden flex-col items-center justify-center text-center p-6 max-w-md space-y-4 z-20">
        <div class="space-y-1">
            <h2 id="errorTitle" class="text-lg font-semibold text-white">Stream Error</h2>
            <p id="errorDesc" class="text-xs sm:text-sm text-gray-400">Could not load the requested stream.</p>
        </div>
        <button onclick="resetToInput()"
            class="bg-white/10 hover:bg-white/20 text-white text-xs font-medium px-5 py-2.5 rounded-xl transition cursor-pointer">
            Change URL
        </button>
    </div>

    <!-- STATE 4: PLAYER STAGE -->
    <div id="playerStage" class="hidden relative w-full h-full bg-black overflow-hidden">
        <iframe id="streamIframe"
            class="hidden w-full h-full border-0 bg-black"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="no-referrer">
        </iframe>

        <video id="streamVideo"
            class="hidden w-full h-full object-contain bg-black"
            controls
            autoplay
            playsinline>
        </video>

        <button id="topUrlPill" onclick="resetToInput()" title="Change URL"
            class="hidden fixed top-4 right-4 z-30 bg-zinc-900/85 hover:bg-zinc-800 border border-white/15 text-white px-3.5 py-2 rounded-xl text-xs font-medium shadow-xl backdrop-blur-md transition cursor-pointer">
            Change URL
        </button>
    </div>

    <script>
        const API_URL = 'https://sonujson-v5.pages.dev/loura.json';

        // Built-in default channels: ?id=Hindi / ?id=English work without any fetch.
        // Add more entries here to make new IDs available.
        const DEFAULT_CHANNELS = [
            {
                "id": "Hindi",
                "name": "Hindi  ",
                "iframeSrc": "https://sonucdn-v5.pages.dev/star?id=STEN3",
                "category": "Cricket",
                "logourl": "",
                "updated_at": "2026-11-18T15:34:23.253Z"
            },
            {
                "id": "English",
                "name": "English ",
                "iframeSrc": "https://sonucdn-v5.pages.dev/star?id=STEN2",
                "category": "Cricket",
                "logourl": "",
                "updated_at": "2026-11-19T06:04:21.156Z"
            }
        ];

        const noIdScreen = document.getElementById('noIdScreen');
        const loaderScreen = document.getElementById('loaderScreen');
        const errorScreen = document.getElementById('errorScreen');
        const errorTitle = document.getElementById('errorTitle');
        const errorDesc = document.getElementById('errorDesc');
        const playerStage = document.getElementById('playerStage');
        const streamIframe = document.getElementById('streamIframe');
        const streamVideo = document.getElementById('streamVideo');
        const topUrlPill = document.getElementById('topUrlPill');
        const customUrlInput = document.getElementById('customUrlInput');
        const inputErrorMsg = document.getElementById('inputErrorMsg');
        const customIdInput = document.getElementById('customIdInput');
        const idChips = document.getElementById('idChips');

        function findChannel(items, targetId) {
            return (items || []).find(item => {
                const itemId = String(item.id || '').trim().toLowerCase();
                const itemName = String(item.name || '').trim().toLowerCase();
                return itemId === targetId || itemName === targetId;
            });
        }

        function renderIdChips() {
            idChips.innerHTML = '';
            DEFAULT_CHANNELS.forEach(ch => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = String(ch.id).trim();
                b.className = 'bg-white/5 hover:bg-white/15 border border-white/10 text-gray-200 text-xs px-3.5 py-1.5 rounded-full transition cursor-pointer';
                b.onclick = () => { customIdInput.value = b.textContent; handleIdPlay(new Event('submit')); };
                idChips.appendChild(b);
            });
        }
        renderIdChips();

        function handleIdPlay(event) {
            event.preventDefault();
            const id = customIdInput.value.trim();
            if (!id) return;
            try {
                const nextUrl = new URL(window.location.href);
                nextUrl.searchParams.delete('url');
                nextUrl.searchParams.set('id', id);
                window.history.replaceState({}, '', nextUrl);
            } catch (e) {}
            initPlayer();
        }

        let shakaInstance = null;
        let hlsInstance = null;

        (function boot() {
            if (window.shaka && shaka.polyfill) {
                shaka.polyfill.installAll();
            }
            initPlayer();
        })();

        function showInputBar() {
            loaderScreen.classList.add('hidden');
            loaderScreen.classList.remove('flex');
            errorScreen.classList.add('hidden');
            errorScreen.classList.remove('flex');
            playerStage.classList.add('hidden');
            topUrlPill.classList.add('hidden');

            noIdScreen.classList.remove('hidden');
            noIdScreen.classList.add('flex');
        }

        function showLoader() {
            noIdScreen.classList.add('hidden');
            noIdScreen.classList.remove('flex');
            errorScreen.classList.add('hidden');
            errorScreen.classList.remove('flex');
            playerStage.classList.add('hidden');

            loaderScreen.classList.remove('hidden');
            loaderScreen.classList.add('flex');
        }

        function showError(title, desc) {
            noIdScreen.classList.add('hidden');
            noIdScreen.classList.remove('flex');
            loaderScreen.classList.add('hidden');
            loaderScreen.classList.remove('flex');
            playerStage.classList.add('hidden');

            errorTitle.textContent = title;
            errorDesc.textContent = desc;
            errorScreen.classList.remove('hidden');
            errorScreen.classList.add('flex');
        }

        async function cleanupPlayers() {
            if (hlsInstance) {
                try { hlsInstance.destroy(); } catch (e) {}
                hlsInstance = null;
            }
            if (shakaInstance) {
                try { await shakaInstance.destroy(); } catch (e) {}
                shakaInstance = null;
            }
            streamVideo.pause();
            streamVideo.removeAttribute('src');
            streamVideo.load();
            streamIframe.src = 'about:blank';
        }

        function parseStreamInput(rawInput) {
            let trimmed = (rawInput || '').trim();
            if (!trimmed) return { error: 'Please enter a valid stream or iframe URL.' };

            const iframeMatch = trimmed.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
            let forceIframe = false;
            if (iframeMatch && iframeMatch[1]) {
                trimmed = iframeMatch[1].trim();
                forceIframe = true;
            }

            if (!/^https?:\/\//i.test(trimmed)) {
                if (/^[\w.-]+\.[a-z]{2,}/i.test(trimmed)) {
                    trimmed = 'https://' + trimmed;
                } else {
                    return { error: 'URL must start with http:// or https://' };
                }
            }

            return { url: trimmed, forceIframe };
        }

        function handleCustomPlay(event) {
            event.preventDefault();
            inputErrorMsg.classList.add('hidden');

            const parsed = parseStreamInput(customUrlInput.value);
            if (parsed.error) {
                inputErrorMsg.textContent = parsed.error;
                inputErrorMsg.classList.remove('hidden');
                return;
            }

            try {
                const nextUrl = new URL(window.location.href);
                nextUrl.searchParams.delete('id');
                nextUrl.searchParams.set('url', parsed.url);
                window.history.replaceState({}, '', nextUrl);
            } catch (e) {}

            startPlayback(parsed.url, 'Custom Stream', 'Direct URL', parsed.forceIframe, true);
        }

        async function initPlayer() {
            const params = new URLSearchParams(window.location.search);
            const rawId = params.get('id');
            const rawUrl = params.get('url');

            if (rawUrl && rawUrl.trim() !== '') {
                const parsed = parseStreamInput(rawUrl);
                if (parsed.error) {
                    showError('Invalid Stream URL', parsed.error);
                    return;
                }
                showLoader();
                await startPlayback(parsed.url, 'Custom Stream', 'Direct URL', parsed.forceIframe, true);
                return;
            }

            if (!rawId || rawId.trim() === '') {
                await cleanupPlayers();
                showInputBar();
                return;
            }

            const targetId = rawId.trim().toLowerCase();
            showLoader();

            try {
                let match = findChannel(DEFAULT_CHANNELS, targetId);

                if (!match) {
                    const response = await fetch(API_URL, { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    const items = Array.isArray(data)
                        ? data
                        : (data.channels || data.streams || data.data || []);
                    match = findChannel(items, targetId);
                }

                if (!match) {
                    showError('Stream Not Found', `No stream matched id "${rawId.trim()}".`);
                    return;
                }

                const streamUrl = match.iframeSrc || match.url || match.streamUrl || match.link || '';
                if (!streamUrl) {
                    showError('Missing Stream Source', `The entry for "${rawId.trim()}" does not have a playable source.`);
                    return;
                }

                const label = (match.name || match.id || rawId).trim();
                const sub = match.category || 'Live Stream';
                const isIframeField = Boolean(match.iframeSrc && streamUrl === match.iframeSrc);

                await startPlayback(streamUrl, label, sub, isIframeField, false);
            } catch (err) {
                console.error('Failed to load stream:', err);
                showError('Connection Failed', 'Unable to fetch stream data right now.');
            }
        }

        async function startPlayback(url, label, sub = 'Live Stream', forceIframe = false, isCustom = false) {
            await cleanupPlayers();

            noIdScreen.classList.add('hidden');
            noIdScreen.classList.remove('flex');
            loaderScreen.classList.add('hidden');
            loaderScreen.classList.remove('flex');
            errorScreen.classList.add('hidden');
            errorScreen.classList.remove('flex');

            playerStage.classList.remove('hidden');
            document.title = `${label} - HelixPull Player`;

            if (isCustom) {
                topUrlPill.classList.remove('hidden');
            } else {
                topUrlPill.classList.add('hidden');
            }

            const lowerUrl = url.toLowerCase();
            const isMpd = lowerUrl.includes('.mpd');
            const isM3u8 = lowerUrl.includes('.m3u8');
            const isDirectVideo = /\.(mp4|webm|ogg|mkv)(\?|$)/i.test(lowerUrl);
            const isDirectMedia = isMpd || isM3u8 || isDirectVideo;

            if (forceIframe || !isDirectMedia) {
                streamVideo.classList.add('hidden');
                streamIframe.setAttribute('referrerpolicy', 'no-referrer');
                streamIframe.src = url;
                streamIframe.classList.remove('hidden');
                return;
            }

            streamIframe.classList.add('hidden');
            streamVideo.classList.remove('hidden');
            streamVideo.removeAttribute('crossorigin');

            if (window.shaka && shaka.Player && shaka.Player.isBrowserSupported() && (isMpd || isM3u8)) {
                try {
                    shakaInstance = new shaka.Player(streamVideo);
                    shakaInstance.configure({
                        streaming: {
                            bufferingGoal: 12,
                            rebufferingGoal: 2,
                            lowLatencyMode: true
                        }
                    });
                    await shakaInstance.load(url);
                    streamVideo.play().catch(() => {});
                    return;
                } catch (err) {
                    console.warn('Shaka fallback to HLS.js:', err);
                    if (shakaInstance) {
                        try { await shakaInstance.destroy(); } catch (e) {}
                        shakaInstance = null;
                    }
                }
            }

            if (window.Hls && Hls.isSupported() && isM3u8) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr) {
                        xhr.withCredentials = false;
                    }
                });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(streamVideo);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    streamVideo.play().catch(() => {});
                });
                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            hlsInstance.startLoad();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                        }
                    }
                });
            } else {
                streamVideo.src = url;
                streamVideo.play().catch(() => {});
            }
        }

        async function resetToInput() {
            await cleanupPlayers();
            try {
                const cleanPageUrl = new URL(window.location.href);
                cleanPageUrl.searchParams.delete('url');
                cleanPageUrl.searchParams.delete('id');
                window.history.replaceState({}, '', cleanPageUrl);
            } catch (e) {}

            document.title = 'HelixPull Player';
            showInputBar();
        }
    </script>
</body>
</html>
