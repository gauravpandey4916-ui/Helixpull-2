<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelixPull Live Sports Hub</title>
    <!-- Include mpegts.js for raw MPEG-TS Stalker/MAG portal stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800;900&family=Space+Mono:wght@700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>
</head>
<body>

    <helixpull-ui></helixpull-ui>

    <script>
    // Configuration object
    window.HelixConfig = {
      sourceUrl: "https://helixpull-cricket.gauravpandey4916.workers.dev/"
    };

    class HelixPullUI extends HTMLElement {
      constructor() {
        super();
        this.shadow = this.attachShadow({ mode: 'open' });
        this.masterChannels = [];
        this.currentStreamId = null;
        this.mediaPlayer = null; // mpegts player instance
        this.stars = [];
        this.animationFrameId = null;
        this.currentParticleRgb = '0, 255, 204'; // Default Cyan Particles

        this.shadow.innerHTML =`
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@800&display=swap');

            /* BASE THEME SETUP */
            :host {
              --primary-rgb: 0, 255, 204;
              --accent: #00ffcc;
              --accent-glow: rgba(0, 255, 204, 0.35);
              --bg-pure: #05070a;
              --bg-card: rgba(13, 19, 28, 0.75);
              --border-glass: rgba(0, 255, 204, 0.12);
              --border-glass-bright: rgba(0, 255, 204, 0.35);
              --heading-dynamic: #ffffff;
              --text-main: #e2e8f0;
              --text-muted: #64748b;
              --text-dark: #475569;
              --btn-main-bg: #00ffcc;
              --btn-main-text: #05070a;
              display: block;
              min-height: 100vh;
              background-color: var(--bg-pure);
              color: var(--text-main);
            }

            /* GOLD THEME */
            :host([data-theme="gold"]) {
              --primary-rgb: 255, 215, 0;
              --accent: #ffd700;
              --accent-glow: rgba(255, 215, 0, 0.35);
              --bg-pure: #080705;
              --bg-card: rgba(22, 19, 13, 0.8);
              --border-glass: rgba(255, 215, 0, 0.15);
              --border-glass-bright: rgba(255, 215, 0, 0.4);
              --heading-dynamic: #ffffff;
              --text-main: #f3f0e6;
              --text-muted: #8c826b;
              --text-dark: #5c5545;
              --btn-main-bg: #ffd700;
              --btn-main-text: #080705;
            }

            * { box-sizing: border-box; }

            /* BOOT SCREEN STYLES */
            .boot {
              position: fixed;
              inset: 0;
              z-index: 2000;
              background: #000000;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              padding: clamp(20px, 4vw, 40px) clamp(24px, 5vw, 60px);
              color: #ffffff;
              transition: opacity 0.5s ease, visibility 0.5s ease;
            }
            .boot.hide {
              opacity: 0;
              visibility: hidden;
              pointer-events: none;
            }
            .boot-header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              font-size: clamp(12px, 1.5vw, 16px);
              font-weight: 700;
              letter-spacing: 3px;
              color: #64748b;
              text-transform: uppercase;
            }
            .boot-time {
              font-family: monospace;
              letter-spacing: 2px;
              color: #94a3b8;
            }
            .boot-center {
              display: flex;
              align-items: center;
              gap: clamp(16px, 3vw, 28px);
              width: 100%;
              max-width: 1200px;
              margin: 0 auto;
            }
            .boot-logo-wrap {
              width: clamp(60px, 8vw, 90px);
              height: clamp(60px, 8vw, 90px);
              border-radius: 20px;
              padding: 2px;
              background: rgba(var(--primary-rgb), 0.3);
              box-shadow: 0 0 35px var(--accent-glow), 0 0 15px var(--accent-glow);
              flex-shrink: 0;
            }
            .boot-logo-wrap img {
              width: 100%;
              height: 100%;
              border-radius: 18px;
              object-fit: cover;
            }
            .boot-title {
              font-size: clamp(32px, 5vw, 56px);
              font-weight: 900;
              letter-spacing: 1px;
              text-transform: uppercase;
              color: #ffffff;
            }
            .boot-footer { width: 100%; }
            .boot-bar {
              width: 100%;
              height: 4px;
              background: rgba(255, 255, 255, 0.12);
              border-radius: 2px;
              overflow: hidden;
              margin-bottom: 16px;
            }
            .boot-fill {
              height: 100%;
              width: 0%;
              background: var(--accent);
              box-shadow: 0 0 14px var(--accent), 0 0 6px var(--accent);
              transition: width 0.1s linear;
            }
            .boot-status {
              display: flex;
              justify-content: space-between;
              align-items: center;
              font-size: clamp(11px, 1.2vw, 14px);
              font-weight: 800;
              letter-spacing: 2px;
              text-transform: uppercase;
            }
            .boot-label { color: #64748b; }
            .boot-percent { color: var(--accent); font-family: monospace; }

            /* WELCOME GATE MODAL */
            .f1-modal-overlay {
              position: fixed;
              inset: 0;
              z-index: 1500;
              background: rgba(0, 0, 0, 0.85);
              backdrop-filter: blur(8px);
              display: flex;
              align-items: center;
              justify-content: center;
              opacity: 0;
              visibility: hidden;
              transition: all 0.3s ease;
            }
            .f1-modal-overlay.open { opacity: 1; visibility: visible; }
            .f1-card {
              background: var(--bg-card);
              border: 1px solid var(--border-glass-bright);
              border-radius: 24px;
              padding: 40px;
              max-width: 440px;
              width: 90%;
              text-align: center;
              box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            }
            .f1-avatar-wrap img {
              width: 80px; height: 80px;
              border-radius: 50%;
              border: 2px solid var(--accent);
            }
            .f1-eyebrow { font-size: 12px; letter-spacing: 2px; color: var(--accent); margin-top: 15px; }
            .f1-title { font-size: 24px; color: var(--heading-dynamic); margin: 10px 0; }
            .f1-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }
            .f1-text-btn {
              background: var(--btn-main-bg);
              color: var(--btn-main-text);
              border: none;
              padding: 12px 28px;
              border-radius: 30px;
              font-weight: 700;
              cursor: pointer;
            }

            /* BACKGROUND CANVAS */
            #warpGridCanvas {
              position: fixed;
              top: 0; left: 0;
              width: 100vw; height: 100vh;
              z-index: 0;
              pointer-events: none;
            }

            /* CONTAINER & VIEWS */
            .container {
              position: relative;
              z-index: 1;
              max-width: 1200px;
              margin: 0 auto;
              padding: 20px;
            }
            .nav {
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 15px 0;
            }
            .brand-title {
              font-size: 24px;
              font-weight: 900;
              letter-spacing: 1px;
              color: var(--heading-dynamic);
              cursor: pointer;
            }
            .brand-sub {
              font-family: 'Space Mono', monospace;
              font-size: 9px;
              font-weight: 700;
              color: var(--accent);
              letter-spacing: 1.5px;
              text-transform: uppercase;
              margin-top: 2px;
            }
            .live-pill-badge {
              background: rgba(239, 68, 68, 0.15);
              color: #ef4444;
              border: 1px solid rgba(239, 68, 68, 0.3);
              padding: 6px 14px;
              border-radius: 20px;
              font-size: 12px;
              font-weight: 700;
              display: flex;
              align-items: center;
              gap: 8px;
            }
            .pulsing-live-dot {
              width: 8px; height: 8px;
              background: #ef4444;
              border-radius: 50%;
              box-shadow: 0 0 8px #ef4444;
            }
            .view-section { display: none; }
            .view-section.active { display: block; }

            .hero { margin: 40px 0 20px 0; }
            .hero-tag { 
              color: var(--accent); 
              font-size: 12px; 
              letter-spacing: 2px; 
              font-weight: 700; 
              font-family: 'Space Mono', monospace;
              text-transform: uppercase;
            }
            .hero-headline { 
              font-family: 'Syne', system-ui, sans-serif;
              font-size: clamp(26px, 7vw, 54px); 
              font-weight: 800; 
              text-transform: uppercase;
              line-height: 1; 
              margin: 10px 0; 
              color: var(--heading-dynamic);
            }
            .accent-txt { color: var(--accent); }
            .hero-details { 
              font-family: 'Space Mono', monospace;
              font-size: 13px; 
              color: var(--text-muted); 
              letter-spacing: 1px; 
            }
            .meta-separator { margin: 0 10px; opacity: 0.3; }
            .track-separator-beam { height: 1px; background: linear-gradient(90deg, transparent, var(--border-glass-bright), transparent); margin: 30px 0; }

            /* CHANNELS GRID */
            .channels-grid {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
              gap: 24px;
            }
            .channel-card {
              background: var(--bg-card);
              border: 1px solid var(--border-glass);
              border-radius: 16px;
              overflow: hidden;
              cursor: pointer;
              transition: all 0.3s ease;
            }
            .channel-card:hover {
              transform: translateY(-5px);
              border-color: var(--border-glass-bright);
              box-shadow: 0 10px 30px var(--accent-glow);
            }
            .card-thumbnail {
              height: 160px;
              background: rgba(0,0,0,0.4);
              position: relative;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              background-size: cover;
              background-position: center;
            }
            .card-network-tag { font-size: 12px; letter-spacing: 2px; color: var(--accent); font-weight: 700; margin-top: 8px; }
            .play-overlay-icon {
              position: absolute; inset: 0;
              background: rgba(0,0,0,0.4);
              display: flex; align-items: center; justify-content: center;
              opacity: 0; transition: opacity 0.2s ease;
            }
            .play-overlay-icon svg { width: 44px; height: 44px; fill: #ffffff; }
            .channel-card:hover .play-overlay-icon { opacity: 1; }
            .card-body { padding: 18px; }
            .card-title { font-size: 18px; font-weight: 700; color: var(--heading-dynamic); margin-bottom: 8px; }
            .card-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); font-weight: 600; }

            /* PLAYER VIEW */
            .player-top-nav { margin-bottom: 20px; }
            .back-home-btn {
              background: transparent;
              border: 1px solid var(--border-glass);
              color: var(--text-main);
              padding: 10px 20px;
              border-radius: 20px;
              cursor: pointer;
            }
            .player-rig-box {
              position: relative;
              width: 100%;
              padding-top: 56.25%;
              background: #000;
              border-radius: 16px;
              overflow: hidden;
              border: 1px solid var(--border-glass);
            }
            .player-rig-box video {
              position: absolute;
              top: 0; left: 0; width: 100%; height: 100%;
              object-fit: contain;
            }
            .player-meta-bar {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-top: 20px;
            }
            .stream-title-group strong { display: block; font-size: 20px; color: var(--heading-dynamic); }
            .stream-title-group span { font-size: 13px; color: var(--text-muted); }

            /* THEME SWITCHER */
            .theme-switch-deck {
              position: fixed;
              bottom: 24px; right: 24px;
              z-index: 100;
              background: var(--bg-card);
              border: 1px solid var(--border-glass);
              border-radius: 30px;
              padding: 4px;
              display: flex;
              gap: 4px;
              backdrop-filter: blur(10px);
            }
            .mode-toggle-btn {
              background: transparent;
              border: none;
              color: var(--text-muted);
              padding: 8px 16px;
              border-radius: 20px;
              font-size: 12px;
              font-weight: 700;
              cursor: pointer;
            }
            .mode-toggle-btn.active {
              background: var(--btn-main-bg);
              color: var(--btn-main-text);
            }
          </style>

          <!-- BOOT SCREEN -->
          <div class="boot" id="boot">
              <div class="boot-header">
                  <div>HELIXPULL / STREAMING WEB</div>
                  <div class="boot-time" id="bootTime">00:00</div>
              </div>
              <div class="boot-center">
                  <div class="boot-logo-wrap">
                      <img src="https://files.catbox.moe/0ghrsb.jpg" alt="Logo">
                  </div>
                  <div class="boot-title">HELIXPULL</div>
              </div>
              <div class="boot-footer">
                  <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
                  <div class="boot-status">
                      <span class="boot-label" id="bootStatus">INITIALIZING SIGNAL</span>
                      <span class="boot-percent" id="bootPercent">0%</span>
                  </div>
              </div>
          </div>

          <!-- WELCOME GATE MODAL -->
          <div class="f1-modal-overlay" id="welcomeGate">
              <div class="f1-card">
                  <div class="f1-avatar-wrap"><img src="https://files.catbox.moe/0ghrsb.jpg"></div>
                  <div class="f1-eyebrow">OFFICIAL HELIXPULL</div>
                  <h2 class="f1-title">The match starts here.</h2>
                  <p class="f1-sub">Welcome to HelixPull IPTV Hub</p>
                  <button class="f1-text-btn" id="dismissWelcomeBtn">LET'S WATCH</button>
              </div>
          </div>

          <canvas id="warpGridCanvas"></canvas>

          <div class="container">
            <header class="nav">
              <a class="brand" id="brandHomeLink">
                <div class="brand-title">HelixPull</div>
                <div class="brand-sub">By Gaurav</div>
              </a>
              <div class="live-pill-badge"><i class="pulsing-live-dot"></i>ON AIR</div>
            </header>

            <div id="home-view" class="view-section active">
              <section class="hero">
                <div class="hero-tag">LIVE BROADCASTS</div>
                <h1 class="hero-headline">SPORTS <br><span class="accent-txt">CHANNELS.</span></h1>
                <div class="hero-details">
                  <b>MASTER DATABASE</b><span class="meta-separator"></span>ALL CHANNELS LIVE<span class="meta-separator"></span>SELECT TO WATCH
                </div>
              </section>

              <div class="track-separator-beam"></div>

              <div id="channels-grid" class="channels-grid">
                <div style="color:var(--text-muted)">Loading channels...</div>
              </div>
            </div>

            <div id="player-view" class="view-section">
              <div class="player-top-nav">
                <button class="back-home-btn" id="backHomeBtn">&#8592; Back to Channels</button>
              </div>

              <div class="player-rig-box" id="playerContainer">
                <!-- HTML5 video element powered by mpegts.js -->
                <video id="nativePlayer" controls autoplay playsinline></video>
              </div>

              <div class="player-meta-bar">
                <div class="stream-title-group">
                  <strong id="activeStreamTitleDisplay">Live Broadcast</strong>
                  <span>HelixPull High-Definition Stream</span>
                </div>
              </div>
            </div>
          </div>

          <aside class="theme-switch-deck" id="themeSwitchDeck">
            <button class="mode-toggle-btn active" id="themeDarkBtn">Obsidian</button>
            <button class="mode-toggle-btn" id="themeGoldBtn">Gold</button>
          </aside>
        `;
      }

      connectedCallback() {
        this.initWarpField();
        this.initEventListeners();
        this.fetchChannels();
        this.startBootSequence();
      }

      disconnectedCallback() {
        if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
        this.cleanupPlayer();
      }

      startBootSequence() {
        const fill = this.shadow.querySelector('#bootFill');
        const percent = this.shadow.querySelector('#bootPercent');
        let progress = 0;
        const interval = setInterval(() => {
          progress += 25;
          fill.style.width = progress + '%';
          percent.textContent = progress + '%';
          if (progress >= 100) {
            clearInterval(interval);
            setTimeout(() => this.shadow.querySelector('#boot').classList.add('hide'), 300);
            setTimeout(() => this.shadow.querySelector('#welcomeGate').classList.add('open'), 500);
          }
        }, 100);
      }

      dismissWelcome() {
        this.shadow.querySelector('#welcomeGate').classList.remove('open');
      }

      async fetchChannels() {
        // Explicitly inject your Fox Sports 501 4K Stalker link
        this.masterChannels = [
          {
            id: "5209",
            title: "FOX SPORTS 501 4K",
            url: "https://streamunlimitedportal.gojo45749.workers.dev?portal=http%3A%2F%2Fsmart4k.me%2F&mac=00%3A1A%3A79%3A00%3A04%3AD9&id=5209",
            logo: "https://streamunlimitedportal.gojo45749.workers.dev?portal=http%3A%2F%2Fsmart4k.me%2F&mac=00%3A1A%3A79%3A00%3A04%3AD9&logo=5125.png"
          }
        ];

        // Fetch remote configuration channels if available
        try {
          const res = await fetch(window.HelixConfig.sourceUrl);
          const data = await res.json();
          const remoteChannels = Array.isArray(data) ? data : (data.channels || data.streams || []);
          this.masterChannels = [...this.masterChannels, ...remoteChannels];
        } catch (err) {
          console.warn("Using local primary feed channels.");
        }

        this.renderGrid();
      }

      renderGrid() {
        const grid = this.shadow.querySelector('#channels-grid');
        grid.innerHTML = '';

        this.masterChannels.forEach((channel, index) => {
          const channelId = channel.id || index;
          const title = channel.title || channel.name || `Channel ${index + 1}`;
          const poster = channel.logo || channel.poster || '';

          const card = document.createElement('div');
          card.className = 'channel-card';
          card.onclick = () => this.openPlayer(channelId, channel.url);

          card.innerHTML = `
            <div class="card-thumbnail" style="background-image: url('${poster}')">
              <div class="play-overlay-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
            </div>
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-meta"><span>4K UHD FEED</span><span style="color:var(--accent);">WATCH NOW</span></div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      openPlayer(identifier, directUrl) {
        const target = this.masterChannels.find(ch => (ch.id == identifier) || (ch.url == directUrl));
        const streamUrl = directUrl || target?.url;
        const displayTitle = target?.title || "FOX SPORTS 501 4K";

        this.shadow.querySelector('#activeStreamTitleDisplay').innerText = displayTitle;
        
        this.shadow.querySelector('#home-view').classList.remove('active');
        this.shadow.querySelector('#player-view').classList.add('active');

        const videoElement = this.shadow.querySelector('#nativePlayer');

        this.cleanupPlayer();

        // Initialize mpegts.js for raw MPEG-TS playback
        if (mpegts.getFeatureList().mseLivePlayback) {
          this.mediaPlayer = mpegts.createPlayer({
            type: 'mpegts',
            isLive: true,
            url: streamUrl,
            cors: true
          });
          this.mediaPlayer.attachMediaElement(videoElement);
          this.mediaPlayer.load();
          this.mediaPlayer.play().catch(err => console.log("Autoplay restriction:", err));
        }

        window.scrollTo(0, 0);
      }

      cleanupPlayer() {
        if (this.mediaPlayer) {
          try {
            this.mediaPlayer.pause();
            this.mediaPlayer.unload();
            this.mediaPlayer.detachMediaElement();
            this.mediaPlayer.destroy();
          } catch (e) {}
          this.mediaPlayer = null;
        }
        const videoElement = this.shadow.querySelector('#nativePlayer');
        if (videoElement) {
          videoElement.pause();
          videoElement.src = '';
        }
      }

      closePlayer() {
        this.cleanupPlayer();
        this.shadow.querySelector('#player-view').classList.remove('active');
        this.shadow.querySelector('#home-view').classList.add('active');
      }

      initEventListeners() {
        this.shadow.querySelector('#backHomeBtn').onclick = () => this.closePlayer();
        this.shadow.querySelector('#brandHomeLink').onclick = () => this.closePlayer();
        this.shadow.querySelector('#dismissWelcomeBtn').onclick = () => this.dismissWelcome();

        this.shadow.querySelector('#themeDarkBtn').onclick = () => {
          this.removeAttribute('data-theme');
          this.shadow.querySelector('#themeDarkBtn').classList.add('active');
          this.shadow.querySelector('#themeGoldBtn').classList.remove('active');
          this.currentParticleRgb = '0, 255, 204';
        };

        this.shadow.querySelector('#themeGoldBtn').onclick = () => {
          this.setAttribute('data-theme', 'gold');
          this.shadow.querySelector('#themeGoldBtn').classList.add('active');
          this.shadow.querySelector('#themeDarkBtn').classList.remove('active');
          this.currentParticleRgb = '255, 215, 0';
        };
      }

      initWarpField() {
        const canvas = this.shadow.getElementById('warpGridCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 60; i++) {
          this.stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 2 + 1,
            alpha: Math.random() * 0.5 + 0.1
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.lineWidth = 1.2;
          this.stars.forEach(star => {
            ctx.strokeStyle = `rgba(${this.currentParticleRgb}, ${star.alpha})`;
            ctx.beginPath();
            ctx.moveTo(star.x, star.y);
            ctx.lineTo(star.x + star.length, star.y);
            ctx.stroke();
            star.x += star.speed;
            if (star.x > canvas.width) {
              star.x = -star.length;
              star.y = Math.random() * canvas.height;
            }
          });
          this.animationFrameId = requestAnimationFrame(render);
        };
        render();
      }
    }

    customElements.define('helixpull-ui', HelixPullUI);
    </script>
</body>
</html>
