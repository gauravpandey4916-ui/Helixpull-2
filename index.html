<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="referrer" content="no-referrer" />
  <title>HELIXPULL Live Stream</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SMZXC121E6');
  </script>

  <!-- Compiled Shaka Engine without UI Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #090b11;
      --gold: #f4c542;
      --gold-bright: #ffd95a;
      --green: #10b981;
      --red: #ef4444;
      --text: #ffffff;
      --muted: #9da6b8;
      --transition: all 0.22s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(244,197,66,0.035), transparent 32%), #000;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-user-select: none;
      user-select: none;
      overflow-x: hidden;
    }

    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 14px 16px 12px; }

    .header {
      min-height: 52px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 8px 16px; margin-bottom: 16px;
      background: linear-gradient(145deg, #0b0d13, #07080c);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-dot {
      width: 12px; height: 12px; flex: 0 0 12px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 8px rgba(244,197,66,0.45);
    }
    .brand-name { font-size: clamp(17px, 4vw, 22px); font-weight: 850; letter-spacing: -0.5px; }

    .join-header {
      min-width: 75px; padding: 6px 16px;
      background: linear-gradient(135deg, var(--gold-bright), #e7ad18);
      color: #080808; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 800; cursor: pointer;
      text-decoration: none; text-align: center; transition: var(--transition);
    }

    .player-panel {
      position: relative; background: #000;
      border: 1px solid rgba(255,255,255,0.11); border-radius: 24px;
      overflow: hidden; margin-bottom: 20px; box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    }

    .player-wrapper { width: 100%; position: relative; aspect-ratio: 16 / 9; background: #000; }
    .player-wrapper:-webkit-full-screen { width: 100vw; height: 100vh; }
    .player-wrapper:fullscreen { width: 100vw; height: 100vh; }

    .video-player, #main-iframe {
      width: 100%; height: 100%; border: none; display: none;
      position: absolute; inset: 0; background: #000; z-index: 1;
      object-fit: cover;
    }

    .player-brand {
      position: absolute; top: 16px; left: 16px; z-index: 5;
      padding: 6px 12px; background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
      color: #fff; font-size: 13px; font-weight: 800; pointer-events: none;
      display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px;
    }

    .watermark-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .watermark-dot.is-live {
      background: var(--green);
      box-shadow: 0 0 8px rgba(16,185,129,0.8);
      animation: blink 1.5s infinite ease-in-out;
    }

    .error-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.94);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; z-index: 10; gap: 14px; padding: 20px; text-align: center;
    }
    .error-overlay.visible { display: flex; }
    .error-message { font-size: 15px; max-width: 320px; color: #fff; }

    .retry-btn {
      padding: 12px 26px; border-radius: 12px;
      background: linear-gradient(135deg, var(--gold-bright), #e2aa18);
      color: #080808; border: none; font-weight: 800; font-size: 14px; cursor: pointer;
    }

    .channel-card {
      display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 22px; margin-bottom: 20px;
      background: linear-gradient(145deg, #0b0d13, #080a0f);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 22px;
    }

    .channel-info { flex: 1; min-width: 0; }
    .channel-title { font-size: clamp(20px, 4vw, 26px); font-weight: 850; margin-bottom: 4px; }
    .channel-language { color: var(--muted); font-size: 16px; }
    .channel-language strong { color: #fff; }

    .live-badge {
      min-width: 150px; padding: 10px 16px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03);
      color: var(--muted); font-size: 15px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
    }

    .live-badge.is-live {
      border-color: rgba(16,185,129,0.28);
      background: rgba(16,185,129,0.06);
      color: var(--green);
    }

    .live-dot { 
      width: 9px; height: 9px; border-radius: 50%; 
      background: var(--red); 
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .live-dot.is-live {
      background: var(--green); 
      box-shadow: 0 0 8px rgba(16,185,129,0.6);
      animation: blink 1.5s infinite ease-in-out; 
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(0.85); }
    }

    .action-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 12px; 
      margin-bottom: 24px; 
    }

    .action-btn {
      min-height: 56px; border-radius: 16px; background: linear-gradient(145deg, #0b0d13, #080a0f);
      border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 16px; font-weight: 750;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; transition: var(--transition);
    }

    .action-btn-gold {
      background: linear-gradient(135deg, var(--gold-bright), #e4ae1c);
      color: #080808;
      border: none;
    }

    .footer-credit { 
      text-align: center; 
      color: #b0b8c8; 
      font-size: 17px; 
      font-weight: 500;
      padding: 8px 10px 24px; 
      line-height: 1.4;
    }
    .footer-top { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px; }
    .footer-bottom { 
      font-size: 20px; 
      font-weight: 900; 
      letter-spacing: 1px; 
      color: #ffffff;
      text-transform: uppercase;
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(15,15,15,0.96); color: #fff; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 650; z-index: 2000; pointer-events: none; opacity: 0;
      transition: all 0.35s ease; border: 1px solid rgba(244,197,66,0.18);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .popup-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none;
      align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .popup-overlay.visible { display: flex; }

    .popup-card {
      background: linear-gradient(145deg, #101219, #08090d); border-radius: 24px;
      padding: 30px; text-align: center; max-width: 380px; width: 100%;
      border: 1px solid rgba(244,197,66,0.2);
    }

    .popup-title { font-size: 24px; font-weight: 850; margin-bottom: 20px; }
    .popup-btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 13px;
      font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 10px; text-decoration: none;
    }
    .popup-btn-primary { background: #000; color: #ff0000; }
    .popup-btn-secondary { background: rgba(255,255,255,0.08); color: #fff; }

    @media (max-width: 650px) {
      .container { padding: 10px 12px 8px; }
      .header { min-height: 48px; padding: 6px 12px; border-radius: 14px; margin-bottom: 12px; }
      .brand-name { font-size: 18px; }
      .join-header { min-width: 65px; padding: 5px 12px; border-radius: 10px; font-size: 12px; }
      .channel-card { padding: 16px 14px; gap: 12px; border-radius: 18px; flex-wrap: wrap; margin-bottom: 16px; }
      .live-badge { width: 100%; }
      .action-grid { gap: 8px; margin-bottom: 18px; }
      .action-btn { min-height: 52px; font-size: 14px; border-radius: 14px; }
      .footer-credit { font-size: 15px; }
      .footer-bottom { font-size: 14px; }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-name">Helixpull Premium</div>
      </div>
      <a class="join-header" href="https://telegram.me/helixpull" target="_blank" rel="noopener noreferrer">Join</a>
    </div>

    <div class="player-panel">
      <div class="player-wrapper" id="playerContainer">
        <div class="player-brand"><span class="watermark-dot" id="watermarkDot"></span> LIVE</div>
        <video id="video" class="video-player" autoplay playsinline controls></video>
        <!-- Standard allow attribute restricting full screen inside iframe directly -->
        <iframe id="main-iframe" allow="autoplay; encrypted-media; picture-in-picture; clipboard-write" referrerpolicy="no-referrer"></iframe>

        <div id="errorOverlay" class="error-overlay">
          <p id="errorMsg" class="error-message">Loading Stream...</p>
          <button class="retry-btn" id="retryBtn">Retry</button>
        </div>
      </div>
    </div>

    <div class="channel-card">
      <div class="channel-info">
        <div class="channel-title">Sony Sports</div>
        <div class="channel-language">Language : <strong>Hindi</strong></div>
      </div>
      <div class="live-badge" id="liveBadge"><span class="live-dot" id="liveDot"></span> LIVE STREAM</div>
    </div>

    <div class="action-grid">
      <button class="action-btn" id="btnShare"><span class="action-icon">⇧</span> Share</button>
      <button class="action-btn" id="btnCopyLink"><span class="action-icon">🔗</span> Copy</button>
      <a class="action-btn action-btn-gold" href="https://telegram.me/helixpull" target="_blank" rel="noopener noreferrer">
        <span class="action-icon">➤</span> Watch Other Matches
      </a>
    </div>

    <div class="footer-credit">
      <div class="footer-top">Made With ❤️ Made For You 🫶</div>
      <div class="footer-bottom">© GAURAV × HELIXPULL</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Telegram Popup -->
  <div id="tgPopup" class="popup-overlay">
    <div class="popup-card">
      <div class="popup-title">Join helixpull</div>
      <button class="popup-btn popup-btn-primary" id="tgJoinBtn1">Join Telegram</button>
      <button class="popup-btn popup-btn-secondary" id="tgCloseBtn">Already Joined</button>
    </div>
  </div>

  <script>
    "use strict";

    const CONFIG = {
      telegramLink: "https://telegram.me/helixpull",
      dataEndpoint: "https://helixpull-cricket.gauravpandey4916.workers.dev/"
    };

    const DOM = {
      video: document.getElementById("video"),
      iframe: document.getElementById("main-iframe"),
      playerContainer: document.getElementById("playerContainer"),
      errorOverlay: document.getElementById("errorOverlay"),
      errorMsg: document.getElementById("errorMsg"),
      retryBtn: document.getElementById("retryBtn"),
      tgPopup: document.getElementById("tgPopup"),
      toast: document.getElementById("toast"),
      btnShare: document.getElementById("btnShare"),
      btnCopyLink: document.getElementById("btnCopyLink"),
      tgJoinBtn1: document.getElementById("tgJoinBtn1"),
      tgCloseBtn: document.getElementById("tgCloseBtn"),
      watermarkDot: document.getElementById("watermarkDot"),
      liveDot: document.getElementById("liveDot"),
      liveBadge: document.getElementById("liveBadge")
    };

    let player = null;
    let toastTimer = null;

    function setLiveStatus(active = false) {
      if (active) {
        DOM.watermarkDot.classList.add("is-live");
        DOM.liveDot.classList.add("is-live");
        DOM.liveBadge.classList.add("is-live");
      } else {
        DOM.watermarkDot.classList.remove("is-live");
        DOM.liveDot.classList.remove("is-live");
        DOM.liveBadge.classList.remove("is-live");
      }
    }

    function toggleContainerFullscreen() {
      const container = DOM.playerContainer;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function showToast(msg = "", duration = 2600) {
      clearTimeout(toastTimer);
      DOM.toast.textContent = msg;
      DOM.toast.classList.add("show");
      toastTimer = setTimeout(() => DOM.toast.classList.remove("show"), duration);
    }

    function showError(msg = "") {
      setLiveStatus(false);
      DOM.errorMsg.textContent = msg || "Playback error. Tap retry.";
      DOM.errorOverlay.classList.add("visible");
      DOM.video.style.display = "none";
      DOM.iframe.style.display = "none";
    }

    function hideError() {
      DOM.errorOverlay.classList.remove("visible");
    }

    function loadIframe(url) {
      hideError();
      setLiveStatus(false);
      DOM.video.style.display = "none";
      DOM.iframe.style.display = "block";
      
      DOM.iframe.src = "about:blank";
      setTimeout(() => {
        DOM.iframe.src = url;
        showToast("Stream Loaded");
        setLiveStatus(true);
      }, 50);
    }

    async function loadShakaPlayer(streamData = {}, rawUrl = "") {
      hideError();
      setLiveStatus(false);
      DOM.iframe.style.display = "none";
      DOM.video.style.display = "block";

      if (!window.shaka || !shaka.Player.isBrowserSupported()) {
        if (streamData.iframeSrc) return loadIframe(streamData.iframeSrc);
        showError("Browser does not support video player.");
        return;
      }

      if (!player) {
        player = new shaka.Player(DOM.video);
        player.addEventListener("error", () => {
          if (streamData.iframeSrc) {
            loadIframe(streamData.iframeSrc);
          } else {
            showError("Stream error. Verify source link.");
          }
        });
      }

      if (streamData.drm && streamData.drm.clearKeys) {
        player.configure({ drm: { clearKeys: streamData.drm.clearKeys } });
      }

      player.getNetworkingEngine().clearAllRequestFilters();
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        if (streamData.cookie) {
          const rawToken = streamData.cookie.replace(/^__hdnea__=/, "").replace(/^Cookie:\s*/i, "").trim();
          if (
            (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
             type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
            request.uris[0] &&
            !request.uris[0].includes("__hdnea__=")
          ) {
            const sep = request.uris[0].includes("?") ? "&" : "?";
            request.uris[0] += sep + "__hdnea__=" + rawToken;
          }
        }
      });

      try {
        const proxiedUrl = "https://corsproxy.io/?_" + encodeURIComponent(rawUrl);
        await player.load(proxiedUrl);
        DOM.video.play().catch(() => {});
        showToast("Stream Playing");
        setLiveStatus(true);
      } catch (err) {
        if (streamData.iframeSrc) {
          loadIframe(streamData.iframeSrc);
        } else {
          showError("Playback error. Failed to load stream.");
        }
      }
    }

    async function startStream() {
      hideError();
      setLiveStatus(false);
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const requestedId = (urlParams.get("id") || "").trim();

        const response = await fetch(CONFIG.dataEndpoint, { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to fetch stream configuration.");

        const data = await response.json();

        let targetData = null;
        if (Array.isArray(data)) {
          targetData = data.find(item => item.id === requestedId) || data[0];
        } else if (data.iframes) {
          targetData = data.iframes.find(item => item.id === requestedId) || data.iframes[0];
        } else {
          targetData = data;
        }

        if (!targetData) throw new Error("Channel ID not found.");

        if (targetData.hit) fetch(targetData.hit).catch(() => {});

        const rawUrl = targetData.streamUrl || targetData.link || targetData.m3u8 || targetData.mpd;
        const isDirectStream = rawUrl && (rawUrl.includes(".m3u8") || rawUrl.includes(".mpd"));

        if (isDirectStream) {
          await loadShakaPlayer(targetData, rawUrl);
        } else if (targetData.iframeSrc || targetData.type === "iframe" || (rawUrl && rawUrl.includes("http"))) {
          loadIframe(targetData.iframeSrc || rawUrl);
        } else {
          throw new Error("No valid stream source or iframe URL found.");
        }
      } catch (err) {
        showError(err && err.message ? err.message : "Failed to load stream.");
      }
    }

    async function handleShare() {
      if (navigator.share) {
        try { 
          await navigator.share({ title: document.title, url: window.location.href }); 
          return; 
        } catch {}
      }
      navigator.clipboard.writeText(window.location.href);
      showToast("Link copied!");
    }

    function initEvents() {
      DOM.retryBtn.addEventListener("click", startStream);
      if (DOM.btnShare) DOM.btnShare.addEventListener("click", handleShare);
      if (DOM.btnCopyLink) DOM.btnCopyLink.addEventListener("click", handleShare);

      DOM.video.addEventListener("playing", () => {
        setLiveStatus(true);
      });

      const enableAudio = () => {
        if (DOM.video) {
          DOM.video.muted = false;
        }
        document.removeEventListener("click", enableAudio);
        document.removeEventListener("touchstart", enableAudio);
      };
      document.addEventListener("click", enableAudio);
      document.addEventListener("touchstart", enableAudio);

      const openTg = () => {
        window.open(CONFIG.telegramLink, "_blank");
        DOM.tgPopup.classList.remove("visible");
        startStream();
      };

      DOM.tgJoinBtn1.addEventListener("click", openTg);
      DOM.tgCloseBtn.addEventListener("click", () => {
        DOM.tgPopup.classList.remove("visible");
        startStream();
      });

      DOM.tgPopup.classList.add("visible");
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.shaka && typeof shaka.polyfill !== "undefined") {
        shaka.polyfill.installAll();
      }
      initEvents();
    });
  </script>
</body>
</html>
