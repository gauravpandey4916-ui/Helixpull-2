           <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a1733">
  <meta name="referrer" content="no-referrer">
  <title>HELIXPULL Live Stream</title>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SMZXC121E6');
  </script>

  <!-- Shaka Player CDN (Engine & UI) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #070d19;
      --card-bg: #0f1a30;
      --accent: #1e78ff;
      --accent-hover: #3b88ff;
      --text: #ffffff;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
      padding: 16px;
    }

    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .channel-title {
      font-size: 14px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .player-panel {
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      margin-bottom: 16px;
      position: relative;
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      background: #000;
    }

    .video-player, #main-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .shaka-spinner-container, .shaka-buffering-spinner, .shaka-spinner {
      display: none !important;
    }

    .error-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 12px;
      padding: 20px;
      text-align: center;
    }

    .error-overlay.visible { display: flex; }

    .error-message { font-size: 15px; color: var(--text-dim); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:hover { background: var(--accent-hover); }

    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .popup-overlay.visible { display: flex; }

    .popup-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }

    .popup-title { font-size: 20px; font-weight: 800; margin-bottom: 16px; }

    .popup-btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .popup-btn-primary { background: #0088cc; color: #fff; }
    .popup-btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="brand">HELIXPULL</div>
      <div class="channel-title" id="channelNameDisplay">Loading...</div>
    </div>

    <div class="player-panel">
      <div class="player-wrapper shaka-mobile shaka-video-container" data-shaka-player-container id="playerContainer" shaka-controls="true">
        <video id="video" class="video-player shaka-video" data-shaka-player autoplay playsinline controlslist="nodownload noremoteplayback" oncontextmenu="return false"></video>
        <iframe id="main-iframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" allowfullscreen="true" referrerpolicy="no-referrer"></iframe>
        
        <div id="errorOverlay" class="error-overlay">
          <p id="errorMsg" class="error-message">Initializing Stream...</p>
          <button class="btn" id="retryBtn">Retry</button>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <button class="btn" id="btnShare">Share Link</button>
      <button class="btn" id="btnCopy">Copy URL</button>
    </div>
  </div>

  <div id="tgPopup" class="popup-overlay">
    <div class="popup-card">
      <div class="popup-title">Join Telegram</div>
      <p style="color: var(--text-dim); margin-bottom: 20px; font-size: 14px;">Join our channel to watch uninterrupted streams.</p>
      <button class="popup-btn popup-btn-primary" id="tgJoinBtn">Join Channel</button>
      <button class="popup-btn popup-btn-secondary" id="tgCloseBtn">Continue Watching</button>
    </div>
  </div>

  <script>
    "use strict";

    const CONFIG = {
      telegramLink: "https://telegram.me/helixpull",
      dataEndpoint: "https://matcheslinkz.pages.dev/id.json"
    };

    let shakaPlayer = null;
    let shakaUI = null;

    async function initShaka() {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        showError("Browser not supported.");
        return;
      }

      const video = document.getElementById("video");
      const container = document.getElementById("playerContainer");

      shakaPlayer = new shaka.Player(video);
      shakaUI = new shaka.ui.Overlay(shakaPlayer, container, video);

      shakaPlayer.addEventListener("error", (e) => console.error("Shaka Error:", e.detail));
    }

    function showError(msg) {
      const errOverlay = document.getElementById("errorOverlay");
      const errText = document.getElementById("errorMsg");
      errText.textContent = msg;
      errOverlay.classList.add("visible");
    }

    function hideError() {
      document.getElementById("errorOverlay").classList.remove("visible");
    }

    async function startStream() {
      hideError();
      const videoEl = document.getElementById("video");
      const iframeEl = document.getElementById("main-iframe");

      try {
        const urlParams = new URLSearchParams(window.location.search);
        const requestedId = (urlParams.get("id") || "").trim();

        const response = await fetch(CONFIG.dataEndpoint, { cache: "no-store" });
        if (!response.ok) throw new Error("Could not fetch data.");
        
        const data = await response.json();
        let target = Array.isArray(data) 
          ? (data.find(item => item.id === requestedId) || data[0]) 
          : data;

        if (!target) {
          showError("No channel found.");
          return;
        }

        document.getElementById("channelNameDisplay").textContent = target.name || "Live Stream";

        // Case A: Stream is an Iframe
        if (target.type === "iframe" || target.iframeSrc) {
          if (shakaPlayer) {
            await shakaPlayer.unload();
          }
          videoEl.style.display = "none";
          iframeEl.style.display = "block";
          iframeEl.src = target.iframeSrc || target.link;
          return;
        }

        // Case B: Native DASH / HLS Stream (Shaka Player)
        iframeEl.style.display = "none";
        iframeEl.src = "";
        videoEl.style.display = "block";

        if (!shakaPlayer) {
          await initShaka();
        }

        // Handle ClearKey DRM configuration if present
        if (target.drm && target.drm.clearKeys) {
          shakaPlayer.configure({ drm: { clearKeys: target.drm.clearKeys } });
        } else if (target.keyId && target.key) {
          shakaPlayer.configure({ drm: { clearKeys: { [target.keyId]: target.key } } });
        }

        await shakaPlayer.load(target.streamUrl || target.link);
        videoEl.play().catch(() => {});

      } catch (err) {
        console.error("Stream Error:", err);
        showError("Failed to load stream. Click retry.");
      }
    }

    function initEvents() {
      document.getElementById("retryBtn").addEventListener("click", startStream);
      
      const copyUrl = () => {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied!");
      };

      document.getElementById("btnShare").addEventListener("click", copyUrl);
      document.getElementById("btnCopy").addEventListener("click", copyUrl);

      const handleAuth = () => {
        window.open(CONFIG.telegramLink, "_blank");
        document.getElementById("tgPopup").classList.remove("visible");
        sessionStorage.setItem("helix_auth", "true");
        startStream();
      };

      document.getElementById("tgJoinBtn").addEventListener("click", handleAuth);
      document.getElementById("tgCloseBtn").addEventListener("click", () => {
        document.getElementById("tgPopup").classList.remove("visible");
        sessionStorage.setItem("helix_auth", "true");
        startStream();
      });

      if (sessionStorage.getItem("helix_auth") === "true") {
        document.getElementById("tgPopup").classList.remove("visible");
        startStream();
      } else {
        document.getElementById("tgPopup").classList.add("visible");
      }
    }

    document.addEventListener("DOMContentLoaded", initEvents);
  </script>
</body>
</html>
})
