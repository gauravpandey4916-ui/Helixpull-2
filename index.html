<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelixPull Live Sports Hub</title>
    <!-- Include HLS.js for direct stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800;900&family=Space+Mono:wght@700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>
</head>
<body>

    <helixpull-ui></helixpull-ui>

    <script>
    window.HelixConfig = {
      sourceUrl: "https://helixpull-cricket.gauravpandey4916.workers.dev/"
    };

    class HelixPullUI extends HTMLElement {
      constructor() {
        super();
        this.shadow = this.attachShadow({ mode: 'open' });
        this.masterChannels = [];
        this.currentStreamId = null;
        this.hlsInstance = null; // Track HLS instance
        this.stars = [];
        this.animationFrameId = null;
        this.currentParticleRgb = '0, 255, 204';

        this.shadow.innerHTML =`
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@800&display=swap');
            :host {
              --primary-rgb: 0, 255, 204;
              --accent: #00ffcc;
              --accent-glow: rgba(0, 255, 204, 0.35);
              --bg-pure: #05070a;
              --bg-card: rgba(13, 19, 28, 0.75);
              --border-glass: rgba(0, 255, 204, 0.12);
              --border-glass-bright: rgba(0, 255, 204, 0.35);
              --heading-dynamic: #ffffff;
              --text-main: #e2e8f0;
              --text-muted: #64748b;
              --btn-main-bg: #00ffcc;
              --btn-main-text: #05070a;
              display: block;
              min-height: 100vh;
              background-color: var(--bg-pure);
              color: var(--text-main);
            }
            :host([data-theme="gold"]) {
              --primary-rgb: 255, 215, 0;
              --accent: #ffd700;
              --accent-glow: rgba(255, 215, 0, 0.35);
              --bg-pure: #080705;
              --bg-card: rgba(22, 19, 13, 0.8);
              --border-glass: rgba(255, 215, 0, 0.15);
              --border-glass-bright: rgba(255, 215, 0, 0.4);
              --btn-main-bg: #ffd700;
              --btn-main-text: #080705;
            }
            * { box-sizing: border-box; }
            .boot { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; color: #fff; transition: opacity 0.5s ease, visibility 0.5s ease; }
            .boot.hide { opacity: 0; visibility: hidden; pointer-events: none; }
            .boot-header { display: flex; justify-content: space-between; color: #64748b; font-weight: 700; letter-spacing: 3px; }
            .boot-center { display: flex; align-items: center; gap: 20px; }
            .boot-logo-wrap { width: 80px; height: 80px; border-radius: 20px; background: rgba(var(--primary-rgb), 0.3); box-shadow: 0 0 35px var(--accent-glow); }
            .boot-logo-wrap img { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; }
            .boot-title { font-size: 48px; font-weight: 900; }
            .boot-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
            .boot-fill { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 14px var(--accent); transition: width 0.1s linear; }
            .boot-status { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
            
            .f1-modal-overlay { position: fixed; inset: 0; z-index: 1500; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
            .f1-modal-overlay.open { opacity: 1; visibility: visible; }
            .f1-card { background: var(--bg-card); border: 1px solid var(--border-glass-bright); border-radius: 24px; padding: 40px; max-width: 440px; width: 90%; text-align: center; }
            .f1-avatar-wrap img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent); }
            .f1-title { font-size: 24px; color: var(--heading-dynamic); margin: 10px 0; }
            .f1-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }
            .f1-text-btn { background: var(--btn-main-bg); color: var(--btn-main-text); border: none; padding: 12px 28px; border-radius: 30px; font-weight: 700; cursor: pointer; }

            #warpGridCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
            .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 20px; }
            .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
            .brand-title { font-size: 24px; font-weight: 900; color: #fff; cursor: pointer; }
            .brand-sub { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
            .live-pill-badge { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
            .pulsing-live-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; }
            
            .view-section { display: none; }
            .view-section.active { display: block; }
            
            .hero { margin: 40px 0 20px 0; }
            .hero-tag { color: var(--accent); font-size: 12px; letter-spacing: 2px; font-weight: 700; font-family: 'Space Mono', monospace; }
            .hero-headline { font-size: clamp(26px, 7vw, 54px); font-weight: 800; text-transform: uppercase; margin: 10px 0; }
            .accent-txt { color: var(--accent); }
            
            .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
            .channel-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; }
            .channel-card:hover { transform: translateY(-5px); border-color: var(--border-glass-bright); box-shadow: 0 10px 30px var(--accent-glow); }
            .card-thumbnail { height: 160px; background: rgba(0,0,0,0.4); position: relative; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; }
            .play-overlay-icon { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
            .play-overlay-icon svg { width: 44px; height: 44px; fill: #fff; }
            .channel-card:hover .play-overlay-icon { opacity: 1; }
            .card-body { padding: 18px; }
            .card-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; }
            .card-meta { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; font-weight: 600; }

            .player-top-nav { margin-bottom: 20px; }
            .back-home-btn { background: transparent; border: 1px solid var(--border-glass); color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
            
            /* Replaced iframe rig box with standard HTML5 video player container */
            .player-rig-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-glass); }
            .player-rig-box video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }

            .player-meta-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
            .stream-title-group strong { display: block; font-size: 20px; color: #fff; }
            .stream-title-group span { font-size: 13px; color: #64748b; }
            
            .theme-switch-deck { position: fixed; bottom: 24px; right: 24px; z-index: 100; background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 30px; padding: 4px; display: flex; gap: 4px; }
            .mode-toggle-btn { background: transparent; border: none; color: #64748b; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
            .mode-toggle-btn.active { background: var(--btn-main-bg); color: var(--btn-main-text); }
          </style>

          <div class="boot" id="boot">
              <div class="boot-header">
                  <div>HELIXPULL / STREAMING WEB</div>
                  <div class="boot-time" id="bootTime">00:00</div>
              </div>
              <div class="boot-center">
                  <div class="boot-logo-wrap"><img src="https://files.catbox.moe/0ghrsb.jpg"></div>
                  <div class="boot-title">HELIXPULL</div>
              </div>
              <div class="boot-footer">
                  <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
                  <div class="boot-status"><span id="bootStatus">INITIALIZING SIGNAL</span><span id="bootPercent">0%</span></div>
              </div>
          </div>

          <div class="f1-modal-overlay" id="welcomeGate">
              <div class="f1-card">
                  <div class="f1-avatar-wrap"><img src="https://files.catbox.moe/0ghrsb.jpg"></div>
                  <h2 class="f1-title">The match starts here.</h2>
                  <p class="f1-sub">Welcome to HelixPull IPTV Hub</p>
                  <button class="f1-text-btn" id="dismissWelcomeBtn">LET'S WATCH</button>
              </div>
          </div>

          <canvas id="warpGridCanvas"></canvas>

          <div class="container">
            <header class="nav">
              <a class="brand" id="brandHomeLink">
                <div class="brand-title">HelixPull</div>
                <div class="brand-sub">By Gaurav</div>
              </a>
              <div class="live-pill-badge"><i class="pulsing-live-dot"></i>ON AIR</div>
            </header>

            <div id="home-view" class="view-section active">
              <section class="hero">
                <div class="hero-tag">LIVE BROADCASTS</div>
                <h1 class="hero-headline">SPORTS <br><span class="accent-txt">CHANNELS.</span></h1>
              </section>
              <div id="channels-grid" class="channels-grid">
                <div>Loading Channels...</div>
              </div>
            </div>

            <div id="player-view" class="view-section">
              <div class="player-top-nav">
                <button class="back-home-btn" id="backHomeBtn">&#8592; Back to Channels</button>
              </div>
              <div class="player-rig-box" id="playerContainer">
                <!-- HTML5 video element powered by HLS.js -->
                <video id="nativePlayer" controls autoplay playsinline></video>
              </div>
              <div class="player-meta-bar">
                <div class="stream-title-group">
                  <strong id="activeStreamTitleDisplay">Live Broadcast</strong>
                  <span>HelixPull High-Definition Stream</span>
                </div>
              </div>
            </div>
          </div>

          <aside class="theme-switch-deck" id="themeSwitchDeck">
            <button class="mode-toggle-btn active" id="themeDarkBtn">Obsidian</button>
            <button class="mode-toggle-btn" id="themeGoldBtn">Gold</button>
          </aside>
        `;
      }

      connectedCallback() {
        this.initWarpField();
        this.initEventListeners();
        this.fetchChannels();
        this.startBootSequence();
      }

      startBootSequence() {
        const fill = this.shadow.querySelector('#bootFill');
        const percent = this.shadow.querySelector('#bootPercent');
        let progress = 0;
        const interval = setInterval(() => {
          progress += 20;
          fill.style.width = progress + '%';
          percent.textContent = progress + '%';
          if (progress >= 100) {
            clearInterval(interval);
            setTimeout(() => this.shadow.querySelector('#boot').classList.add('hide'), 300);
            setTimeout(() => this.shadow.querySelector('#welcomeGate').classList.add('open'), 500);
          }
        }, 100);
      }

      dismissWelcome() {
        this.shadow.querySelector('#welcomeGate').classList.remove('open');
      }

      async fetchChannels() {
        // Manually injecting your Fox Sports 501 4K stream along with any configuration channels
        this.masterChannels = [
          {
            id: "5209",
            title: "FOX SPORTS 501 4K",
            url: "https://streamunlimitedportal.gojo45749.workers.dev?portal=http%3A%2F%2Fsmart4k.me%2F&mac=00%3A1A%3A79%3A00%3A04%3AD9&id=5209",
            logo: "https://streamunlimitedportal.gojo45749.workers.dev?portal=http%3A%2F%2Fsmart4k.me%2F&mac=00%3A1A%3A79%3A00%3A04%3AD9&logo=5125.png"
          }
        ];

        // You can also merge fetched channels if your worker database contains it:
        try {
          const res = await fetch(window.HelixConfig.sourceUrl);
          const data = await res.json();
          const remoteChannels = Array.isArray(data) ? data : (data.channels || data.streams || []);
          this.masterChannels = [...this.masterChannels, ...remoteChannels];
        } catch (e) {
          console.log("Using local default fallback channel list");
        }

        this.renderGrid();
      }

      renderGrid() {
        const grid = this.shadow.querySelector('#channels-grid');
        grid.innerHTML = '';

        this.masterChannels.forEach((channel, index) => {
          const channelId = channel.id || index;
          const title = channel.title || channel.name || "Live Channel";
          const poster = channel.logo || channel.poster || '';

          const card = document.createElement('div');
          card.className = 'channel-card';
          card.onclick = () => this.openPlayer(channelId, channel.url);

          card.innerHTML = `
            <div class="card-thumbnail" style="background-image: url('${poster}')">
              <div class="play-overlay-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
            </div>
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-meta"><span>4K UHD FEED</span><span style="color:var(--accent);">WATCH NOW</span></div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      openPlayer(identifier, directUrl) {
        const target = this.masterChannels.find(ch => (ch.id == identifier) || (ch.url == directUrl));
        const streamUrl = directUrl || target?.url;
        const displayTitle = target?.title || "Fox Sports 501 4K";

        this.shadow.querySelector('#activeStreamTitleDisplay').innerText = displayTitle;
        
        this.shadow.querySelector('#home-view').classList.remove('active');
        this.shadow.querySelector('#player-view').classList.add('active');

        const videoElement = this.shadow.querySelector('#nativePlayer');

        // Clean up previous HLS instance if any
        if (this.hlsInstance) {
          this.hlsInstance.destroy();
          this.hlsInstance = null;
        }

        // Initialize HLS.js player for Stalker proxy stream
        if (Hls.isSupported()) {
          this.hlsInstance = new Hls();
          this.hlsInstance.loadSource(streamUrl);
          this.hlsInstance.attachMedia(videoElement);
          this.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            videoElement.play().catch(e => console.log("Autoplay blocked:", e));
          });
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
          // Native Safari / iOS support
          videoElement.src = streamUrl;
          videoElement.addEventListener('loadedmetadata', () => {
            videoElement.play();
          });
        }

        window.scrollTo(0, 0);
      }

      closePlayer() {
        const videoElement = this.shadow.querySelector('#nativePlayer');
        videoElement.pause();
        videoElement.src = '';

        if (this.hlsInstance) {
          this.hlsInstance.destroy();
          this.hlsInstance = null;
        }

        this.shadow.querySelector('#player-view').classList.remove('active');
        this.shadow.querySelector('#home-view').classList.add('active');
      }

      initEventListeners() {
        this.shadow.querySelector('#backHomeBtn').onclick = () => this.closePlayer();
        this.shadow.querySelector('#brandHomeLink').onclick = () => this.closePlayer();
        this.shadow.querySelector('#dismissWelcomeBtn').onclick = () => this.dismissWelcome();

        this.shadow.querySelector('#themeDarkBtn').onclick = () => {
          this.removeAttribute('data-theme');
          this.shadow.querySelector('#themeDarkBtn').classList.add('active');
          this.shadow.querySelector('#themeGoldBtn').classList.remove('active');
        };

        this.shadow.querySelector('#themeGoldBtn').onclick = () => {
          this.setAttribute('data-theme', 'gold');
          this.shadow.querySelector('#themeGoldBtn').classList.add('active');
          this.shadow.querySelector('#themeDarkBtn').classList.remove('active');
        };
      }

      initWarpField() {
        const canvas = this.shadow.getElementById('warpGridCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        for (let i = 0; i < 60; i++) {
          this.stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: Math.random() * 20 + 10,
            speed: Math.random() * 2 + 1,
            alpha: Math.random() * 0.5 + 0.1
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          this.stars.forEach(star => {
            ctx.strokeStyle = `rgba(0, 255, 204, ${star.alpha})`;
            ctx.beginPath();
            ctx.moveTo(star.x, star.y);
            ctx.lineTo(star.x + star.length, star.y);
            ctx.stroke();
            star.x += star.speed;
            if (star.x > canvas.width) star.x = -star.length;
          });
          this.animationFrameId = requestAnimationFrame(render);
        };
        render();
      }
    }

    customElements.define('helixpull-ui', HelixPullUI);
    </script>
</body>
</html>
